<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyApp — Google Sign In</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Smooth fade/slide-in for the profile card */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.45s ease-out both; }
  </style>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800 antialiased">

  <!-- ============================= NAVBAR ============================= -->
  <header class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white/80 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">

      <!-- Logo -->
      <a href="#" class="flex items-center gap-2">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600 text-white shadow-sm">
          <!-- Simple bolt logo -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="text-lg font-bold tracking-tight text-gray-900">MyApp</span>
      </a>

      <!-- Right side: Sign In button OR user chip -->
      <div class="flex items-center gap-3">

        <!-- Loading spinner while Firebase checks auth state -->
        <div id="nav-loading" class="h-8 w-8 animate-spin rounded-full border-2 border-indigo-200 border-t-indigo-600"></div>

        <!-- Sign In with Google button (shown when logged out) -->
        <button id="sign-in-btn"
          class="hidden items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition hover:bg-gray-50 hover:shadow focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-[0.98]">
          <!-- Google "G" logo -->
          <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/>
          </svg>
          Sign In with Google
        </button>

        <!-- User chip + dropdown (shown when logged in) -->
        <div id="user-menu" class="relative hidden">
          <button id="user-menu-btn" class="flex items-center gap-2 rounded-full py-1 pl-1 pr-3 transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            <img id="nav-avatar" src="" alt="Profile"
                 class="h-9 w-9 rounded-full object-cover ring-2 ring-indigo-100" referrerpolicy="no-referrer" />
            <span id="nav-username" class="hidden max-w-[140px] truncate text-sm font-medium text-gray-700 sm:block"></span>
            <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- Dropdown -->
          <div id="user-dropdown"
               class="absolute right-0 mt-2 hidden w-48 origin-top-right rounded-xl border border-gray-200 bg-white py-1 shadow-lg">
            <div class="border-b border-gray-100 px-4 py-2">
              <p id="dropdown-name" class="truncate text-sm font-semibold text-gray-900"></p>
              <p id="dropdown-email" class="truncate text-xs text-gray-500"></p>
            </div>
            <button id="sign-out-btn"
              class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-red-600 transition hover:bg-red-50">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- ============================= MAIN ============================= -->
  <main class="mx-auto max-w-6xl px-4 py-16 sm:px-6">

    <!-- Logged-out hero (shown when NOT signed in) -->
    <section id="hero-section" class="hidden text-center">
      <h1 class="mx-auto max-w-2xl text-4xl font-extrabold tracking-tight text-gray-900 sm:text-5xl">
        Welcome to <span class="text-indigo-600">MyApp</span>
      </h1>
      <p class="mx-auto mt-4 max-w-xl text-lg text-gray-600">
        Sign in with your Google account to access your personalized dashboard.
      </p>
      <button id="hero-sign-in-btn"
        class="mx-auto mt-8 flex items-center gap-3 rounded-xl bg-indigo-600 px-6 py-3 text-base font-semibold text-white shadow-lg shadow-indigo-600/25 transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-[0.98]">
        <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#fff" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.6 30.2 0.5 24 0.5 14.8 0.5 6.9 6.5 3.6 14.6l7.8 6C13.6 14.1 18.4 9.5 24 9.5z" opacity=".9"/>
          <path fill="#fff" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.6-4.8 7.3l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.6z" opacity=".9"/>
          <path fill="#fff" d="M11.4 28.6c-.6-1.7-.9-3.4-.9-5.1s.3-3.5 1-5.1l-7.8-6C1.3 16 0.5 19.9 0.5 24s.8 8 3.1 11.5l7.8-6.9z" opacity=".7"/>
          <path fill="#fff" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.2-8.4 2.2-5.6 0-10.4-4.6-12.6-9.8l-7.8 6C6.9 41.5 14.8 48 24 48z" opacity=".8"/>
        </svg>
        Continue with Google
      </button>
    </section>

    <!-- Profile section (shown when signed in) -->
    <section id="profile-section" class="hidden">
      <div class="animate-fade-up mx-auto max-w-md overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-xl shadow-gray-200/60">

        <!-- Banner -->
        <div class="h-28 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

        <!-- Avatar -->
        <div class="-mt-14 flex justify-center">
          <img id="profile-avatar" src="" alt="Profile picture"
               class="h-24 w-24 rounded-full border-4 border-white object-cover shadow-md" referrerpolicy="no-referrer" />
        </div>

        <!-- Info -->
        <div class="px-6 pb-8 pt-4 text-center">
          <h2 id="profile-name" class="text-2xl font-bold text-gray-900"></h2>
          <p id="profile-email" class="mt-1 text-sm text-gray-500"></p>

          <div class="mt-4 flex items-center justify-center gap-2">
            <span id="verified-badge"
              class="hidden items-center gap-1 rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
              Email Verified
            </span>
            <span class="inline-flex items-center gap-1 rounded-full bg-indigo-100 px-3 py-1 text-xs font-medium text-indigo-700">
              <svg class="h-3.5 w-3.5" viewBox="0 0 48 48">
                <path fill="currentColor" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.6 30.2 0.5 24 0.5 14.8 0.5 6.9 6.5 3.6 14.6l7.8 6C13.6 14.1 18.4 9.5 24 9.5zm22.5 15c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.6-4.8 7.3l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.6zM11.4 28.6c-.6-1.7-.9-3.4-.9-5.1s.3-3.5 1-5.1l-7.8-6C1.3 16 0.5 19.9 0.5 24s.8 8 3.1 11.5l7.8-6.9zM24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.2-8.4 2.2-5.6 0-10.4-4.6-12.6-9.8l-7.8 6C6.9 41.5 14.8 48 24 48z"/>
              </svg>
              Google Account
            </span>
          </div>

          <!-- Details grid -->
          <div class="mt-6 grid grid-cols-1 gap-3 rounded-xl bg-gray-50 p-4 text-left text-sm">
            <div class="flex items-center justify-between gap-4">
              <span class="font-medium text-gray-500">User ID</span>
              <span id="profile-uid" class="max-w-[200px] truncate font-mono text-xs text-gray-700"></span>
            </div>
            <div class="flex items-center justify-between gap-4">
              <span class="font-medium text-gray-500">Provider</span>
              <span id="profile-provider" class="text-gray-700">google.com</span>
            </div>
            <div class="flex items-center justify-between gap-4">
              <span class="font-medium text-gray-500">Last Sign-In</span>
              <span id="profile-last-login" class="text-gray-700"></span>
            </div>
          </div>

          <button id="profile-sign-out-btn"
            class="mt-6 w-full rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-600 transition hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 active:scale-[0.98]">
            Sign Out
          </button>
        </div>
      </div>
    </section>

    <!-- Error toast -->
    <div id="error-toast"
         class="fixed bottom-5 right-5 z-50 hidden max-w-sm items-start gap-3 rounded-xl border border-red-200 bg-white p-4 shadow-2xl">
      <svg class="mt-0.5 h-5 w-5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div>
        <p class="text-sm font-semibold text-gray-900">Authentication Error</p>
        <p id="error-message" class="mt-0.5 text-sm text-gray-600"></p>
      </div>
    </div>
  </main>

  <!-- ============================= FIREBASE AUTH ============================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* ---------------------------------------------------------------
     * TODO: Replace with YOUR Firebase project's web config.
     * Firebase Console → Project Settings → General → Your apps → Web
     * --------------------------------------------------------------- */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    // ---------- DOM references ----------
    const $ = (id) => document.getElementById(id);
    const navLoading = $("nav-loading");
    const signInBtn = $("sign-in-btn");
    const heroSignInBtn = $("hero-sign-in-btn");
    const userMenu = $("user-menu");
    const userMenuBtn = $("user-menu-btn");
    const userDropdown = $("user-dropdown");
    const heroSection = $("hero-section");
    const profileSection = $("profile-section");

    // ---------- Helpers ----------
    const show = (el) => { el.classList.remove("hidden"); if (el.id === "sign-in-btn") el.classList.add("flex"); };
    const hide = (el) => { el.classList.add("hidden"); if (el.id === "sign-in-btn") el.classList.remove("flex"); };

    // Fallback avatar (initials) if the user has no Google profile photo
    const fallbackAvatar = (name) =>
      "https://ui-avatars.com/api/?background=4f46e5&color=fff&name=" +
      encodeURIComponent(name || "User");

    function showError(message) {
      const toast = $("error-toast");
      $("error-message").textContent = message;
      show(toast); toast.classList.add("flex");
      setTimeout(() => { hide(toast); toast.classList.remove("flex"); }, 5000);
    }

    // ---------- Auth actions ----------
    async function handleSignIn() {
      try {
        await signInWithPopup(auth, provider);
        // onAuthStateChanged below handles the UI update
      } catch (error) {
        if (error.code === "auth/popup-closed-by-user") return; // user just closed it
        if (error.code === "auth/cancelled-popup-request") return;
        console.error(error);
        showError(error.message.replace("Firebase: ", ""));
      }
    }

    async function handleSignOut() {
      try {
        await signOut(auth);
      } catch (error) {
        console.error(error);
        showError("Could not sign out. Please try again.");
      }
    }

    // ---------- Auth state observer ----------
    onAuthStateChanged(auth, (user) => {
      hide(navLoading);

      if (user) {
        // ---- Logged in ----
        const name = user.displayName || "Anonymous User";
        const email = user.email || "";
        const photo = user.photoURL || fallbackAvatar(name);
        const lastLogin = user.metadata?.lastSignInTime
          ? new Date(user.metadata.lastSignInTime).toLocaleString()
          : "—";

        // Navbar chip
        $("nav-avatar").src = photo;
        $("nav-username").textContent = name.split(" ")[0];
        $("dropdown-name").textContent = name;
        $("dropdown-email").textContent = email;

        // Profile card
        $("profile-avatar").src = photo;
        $("profile-name").textContent = name;
        $("profile-email").textContent = email;
        $("profile-uid").textContent = user.uid;
        $("profile-last-login").textContent = lastLogin;
        const badge = $("verified-badge");
        if (user.emailVerified) { show(badge); badge.classList.add("inline-flex"); }
        else { hide(badge); badge.classList.remove("inline-flex"); }

        // Toggle visibility
        hide(signInBtn); hide(heroSection);
        show(userMenu); show(profileSection);
      } else {
        // ---- Logged out ----
        hide(userMenu); hide(profileSection); hide(userDropdown);
        show(signInBtn); show(heroSection);
      }
    });

    // ---------- Event listeners ----------
    signInBtn.addEventListener("click", handleSignIn);
    heroSignInBtn.addEventListener("click", handleSignIn);
    $("sign-out-btn").addEventListener("click", handleSignOut);
    $("profile-sign-out-btn").addEventListener("click", handleSignOut);

    // Dropdown toggle
    userMenuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle("hidden");
    });
    document.addEventListener("click", (e) => {
      if (!userMenu.contains(e.target)) hide(userDropdown);
    });
  </script>
</body>
  </html>
