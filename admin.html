<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Game Masters BD</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Navbar -->
    <nav class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-red-500">Game Masters BD - Admin Panel</h1>
        <a href="index.html" class="bg-blue-600 px-4 py-2 rounded text-sm hover:bg-blue-700">Home</a>
    </nav>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-6 mt-6">
        <h2 class="text-2xl font-bold mb-6 text-yellow-300">⚙️ Pending User Requests</h2>

        <!-- Deposit Requests Table -->
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden border border-gray-700 mb-8">
            <div class="p-4 bg-gray-750 border-b border-gray-700 font-semibold text-lg text-yellow-400">Deposit Requests</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300 text-sm">
                            <th class="p-3">User Email</th>
                            <th class="p-3">Method</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">TrxID</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="depositTableBody" class="divide-y divide-gray-700 text-sm">
                        <!-- Sample Row for Demo -->
                        <tr>
                            <td class="p-3">user@gmail.com</td>
                            <td class="p-3">bKash</td>
                            <td class="p-3 text-green-400 font-bold">৳ 500</td>
                            <td class="p-3 font-mono text-yellow-200">TRX98765432</td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="approveDeposit(this, 500)" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-xs font-bold">Approve</button>
                                <button onclick="rejectRequest(this)" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold">Reject</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Withdrawal Requests Table -->
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden border border-gray-700">
            <div class="p-4 bg-gray-750 border-b border-gray-700 font-semibold text-lg text-yellow-400">Withdrawal Requests</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300 text-sm">
                            <th class="p-3">User Email</th>
                            <th class="p-3">Number</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawTableBody" class="divide-y divide-gray-700 text-sm">
                        <!-- Sample Row for Demo -->
                        <tr>
                            <td class="p-3">player@gmail.com</td>
                            <td class="p-3">01700000000</td>
                            <td class="p-3 text-red-400 font-bold">৳ 300</td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="approveWithdraw(this)" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-xs font-bold">Paid</button>
                                <button onclick="rejectRequest(this)" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold">Reject</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript for Admin Actions -->
    <script>
        function approveDeposit(button, amount) {
            alert(`Deposit approved! ৳${amount} has been added to the user's wallet.`);
            button.closest('tr').remove();
        }

        function approveWithdraw(button) {
            alert(`Withdrawal request marked as Paid!`);
            button.closest('tr').remove();
        }

        function rejectRequest(button) {
            const confirmReject = confirm("Are you sure you want to reject this request?");
            if (confirmReject) {
                button.closest('tr').remove();
                alert("Request rejected.");
            }
        }
    </script>

</body>
</html>
